[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-mcp"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27.2,<2",
    "mistletoe==1.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
md-mcp = "md_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/md_mcp"]
