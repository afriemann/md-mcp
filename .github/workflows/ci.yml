name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal permissions — no write access required for tests or linting.
# Each job may tighten further; no job may widen beyond this.
permissions:
  contents: read

# Cancel any in-progress run for the same ref when a new one is triggered.
# Keeps PRs from queuing up multiple runs on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Run tests
        run: uv run pytest tests/ -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Check formatting
        run: uv run ruff format --check src/ tests/
      - name: Check linting
        run: uv run ruff check src/ tests/
